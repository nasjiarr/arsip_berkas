<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Chain 1: Diagonal from top-left to bottom-right -->
  <g fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.2">
    <!-- Geblek at (30, 30) -->
    <circle cx="22" cy="22" r="12"/>
    <circle cx="22" cy="22" r="6" stroke-width="0.8"/>
    <circle cx="22" cy="22" r="2.5" fill="rgba(255,255,255,0.12)"/>
    <circle cx="38" cy="38" r="12"/>
    <circle cx="38" cy="38" r="6" stroke-width="0.8"/>
    <circle cx="38" cy="38" r="2.5" fill="rgba(255,255,255,0.12)"/>
    
    <!-- Geblek at (90, 90) -->
    <circle cx="82" cy="82" r="12"/>
    <circle cx="82" cy="82" r="6" stroke-width="0.8"/>
    <circle cx="82" cy="82" r="2.5" fill="rgba(255,255,255,0.12)"/>
    <circle cx="98" cy="98" r="12"/>
    <circle cx="98" cy="98" r="6" stroke-width="0.8"/>
    <circle cx="98" cy="98" r="2.5" fill="rgba(255,255,255,0.12)"/>
    
    <!-- Renteng connector links -->
    <path d="M38 38 Q60 50 82 82" stroke-width="0.8" stroke-dasharray="3 3"/>
    <path d="M98 98 Q115 110 120 115 M0 5 Q5 10 22 22" stroke-width="0.8" stroke-dasharray="3 3"/>
    
    <!-- Off-diagonal floral / leaf motif at (30, 90) and (90, 30) -->
    <circle cx="30" cy="90" r="8" stroke-width="0.8"/>
    <circle cx="30" cy="90" r="2" fill="rgba(255,255,255,0.1)"/>
    <path d="M22 90 C22 84 38 84 38 90 C38 96 22 96 22 90 Z" stroke-width="0.7"/>
    
    <circle cx="90" cy="30" r="8" stroke-width="0.8"/>
    <circle cx="90" cy="30" r="2" fill="rgba(255,255,255,0.1)"/>
    <path d="M82 30 C82 24 98 24 98 30 C98 36 82 36 82 30 Z" stroke-width="0.7"/>
  </g>
</svg>